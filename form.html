<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета пользователя</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   
    <nav class="navigation">
        <a href="index.html">Главная</a>
        <a href="raspisania.html">Расписание</a>
        <a href="food.html">Питание</a>
        <a href="calc.html">Калькулятор</a>
        <a href="form.html" class="active">Анкета</a>
    </nav>
    <div class="weather-widget">
        <span id="weather-loading-text">Загрузка погоды...</span>
    </div>

    <div class="container">
        <h1>Анкета пользователя</h1>
        <p style="color: #7f8c8d; margin-bottom: 25px;">Пожалуйста, заполните форму ниже. Мы обработаем данные и посчитаем время до вашего векового юбилея!</p>

        <div class="form-wrapper">
            <form id="user-form">
                <div class="form-group">
                    <label for="fio">👤 ФИО:</label>
                    <input type="text" id="fio" placeholder="Иванов Иван Иванович" required>
                </div>

                <div class="form-group">
                    <label for="dob">📅 Дата рождения:</label>
                    <input type="date" id="dob" required>
                </div>

                <div class="form-group">
                    <label for="email">📧 Электронная почта:</label>
                    <input type="email" id="email" placeholder="example@mail.ru" required>
                </div>

                <div class="form-group">
                    <label for="phone">📱 Телефон:</label>
                    <input type="tel" id="phone" placeholder="+7 (999) 123-45-67">
                </div>

                <div class="form-group">
                    <label for="bio">✍️ О своих увлечениях:</label>
                    <textarea id="bio" rows="4" placeholder="Расскажите немного о себе и своих хобби..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Отправить анкету</button>
            </form>
        </div>

        <!-- Блок результатов (по умолчанию скрыт стилями, пока форма не отправлена) -->
        <div id="form-results" class="results-wrapper" style="display: none;">
            <h2>📊 Обработка данных</h2>
            <div id="results-content">
                <!-- Сюда JavaScript вставит результаты -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
